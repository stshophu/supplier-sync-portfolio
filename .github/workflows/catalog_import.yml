name: Supplier Tier 1 — Full Catalog Import

on:
  schedule:
    - cron: "0 3 * * *"        # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      commit:
        description: "Apply to Shopify (otherwise dry run)"
        type: boolean
        default: false
      price_rule:
        description: "Price rule for this manual run: legacy (today) or floor (min-profit)"
        type: choice
        options: [floor, legacy]
        default: floor
      min_profit:
        description: "Minimum profit per item (EUR)"
        default: "40"
      ship_cost_de:
        description: "DHL cost per parcel to Germany (EUR)"
        default: "10"
      beyond_shortfall:
        description: "Beyond: DHL cost to Hong Kong minus the 50 EUR the buyer pays (EUR)"
        default: "0"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Tier 1 import
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          PRICE_RULE: ${{ github.event_name == 'workflow_dispatch' && inputs.price_rule || vars.PRICE_RULE || 'legacy' }}
          MIN_PROFIT_EUR: ${{ github.event_name == 'workflow_dispatch' && inputs.min_profit || vars.MIN_PROFIT_EUR }}
          SHIP_COST_DE: ${{ github.event_name == 'workflow_dispatch' && inputs.ship_cost_de || vars.SHIP_COST_DE }}
          BEYOND_SHORTFALL: ${{ github.event_name == 'workflow_dispatch' && inputs.beyond_shortfall || vars.BEYOND_SHORTFALL }}
          EXTRA_COST_ORDER: ${{ vars.EXTRA_COST_ORDER }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SUPPLIER_LOCATION_ID: ${{ secrets.SUPPLIER_LOCATION_ID }}
          SUPPLIER_PRICE_FEED: ${{ secrets.SUPPLIER_PRICE_FEED }}
          SUPPLIER_CATALOG_FEED: ${{ secrets.SUPPLIER_CATALOG_FEED }}
          # Private URL (e.g. a Google Drive direct-download link) -- not
          # committed to this repo since it's real supplier catalog data.
          SUPPLIER_FALLBACK_FEED: ${{ secrets.SUPPLIER_FALLBACK_FEED }}
        run: |
          if [ "${{ github.event_name == 'schedule' || github.event.inputs.commit == 'true' }}" = "true" ]; then
            python3 catalog_import.py --commit
          else
            python3 catalog_import.py
          fi
