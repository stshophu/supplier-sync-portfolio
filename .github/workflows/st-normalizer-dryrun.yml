name: ST normalizer — dry run report

# Default (report-only / preview-20) NEVER writes. Writing needs mode write-20/write-all AND confirm=WRITE.
on:
  workflow_dispatch:
    inputs:
      status:
        description: "Which products (active or any)"
        type: choice
        options: [active, any]
        default: active
      mode:
        description: "preview-20 = show 20 sample changes (no write); write-20 / write-all = WRITE to Shopify"
        type: choice
        options: [report-only, preview-20, write-20, write-all]
        default: report-only
      ids:
        description: "Optional: comma-separated product ids (limits preview/write to these)"
        type: string
        default: ""
      confirm:
        description: 'Type WRITE to allow write-20 / write-all'
        type: string
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run normalizer (dry run)
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          IMPORT_HOOK_SECRET: ${{ secrets.IMPORT_HOOK_SECRET }}
          VAITTO_SUPABASE_URL: ${{ secrets.VAITTO_SUPABASE_URL }}
          VAITTO_SUPABASE_SERVICE_KEY: ${{ secrets.VAITTO_SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          EXTRA=""
          case "${{ github.event.inputs.mode }}" in
            preview-20) EXTRA="--sample 20" ;;
            write-20)   EXTRA="--sample 20 --write --confirm ${{ github.event.inputs.confirm }}" ;;
            write-all)  EXTRA="--write --confirm ${{ github.event.inputs.confirm }}" ;;
          esac
          if [ -n "${{ github.event.inputs.ids }}" ]; then EXTRA="$EXTRA --ids ${{ github.event.inputs.ids }}"; fi
          python3 st_normalizer.py --status "${{ github.event.inputs.status }}" --out st_normalizer_report.csv $EXTRA | tee summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: st-normalizer-report
          path: |
            st_normalizer_report.csv
            summary.txt
            st_backup_before_write.csv
